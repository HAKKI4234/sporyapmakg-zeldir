<script>
    const STORAGE_KEY = 'fittrack_data_v6'; 
    
    let state = {
        isFirstLaunch: true,
        currentView: 'calendar', // İlk girişte direkt takvimi göster
        totalWorkouts: 0, // Seri yerine Toplam Gün kullanıyoruz (Asla sıfırlanmaz)
        workoutHistory: {}, // {'YYYY-MM-DD': true} şeklinde biten antrenmanlar
        schedule: {}, // {'YYYY-MM-DD': ['Göğüs', 'Sırt']} şeklinde güne özel planlar
        weights: {},
        reminderTimes: ['09:00'] 
    };

    let currentCalDate = new Date();
    let calYear = currentCalDate.getFullYear();
    let calMonth = currentCalDate.getMonth();

    function toDateStr(year, month, day) {
        return `${year}-${String(month+1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    }

    function parseDateStr(str) {
        let parts = str.split('-');
        return new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
    }

    function getDaysInMonth(year, month) {
        return new Date(year, month + 1, 0).getDate();
    }

    function getFirstDayOfMonth(year, month) {
        let day = new Date(year, month, 1).getDay();
        return day === 0 ? 6 : day - 1; // Pazartesi = 0 olacak şekilde ayarla
    }

    function loadState() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                state = { ...state, ...parsed };
                
                // Eski sürümden geçiş (Haftanın günleri 0-6 yerine YYYY-MM-DD formatına)
                if (state.schedule && Object.keys(state.schedule).some(k => k.length <= 1)) {
                    let oldSchedule = { ...state.schedule };
                    state.schedule = {};
                    let today = new Date();
                    // Eski haftalık planı önümüzdeki 30 günün takvimine otomatik kopyala
                    for(let i=0; i<30; i++) {
                        let tempDate = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
                        let dayOfWeek = tempDate.getDay();
                        if(oldSchedule[dayOfWeek]) {
                            state.schedule[toDateStr(tempDate.getFullYear(), tempDate.getMonth(), tempDate.getDate())] = oldSchedule[dayOfWeek];
                        }
                    }
                    if (state.totalWorkouts === undefined && state.streak !== undefined) {
                        state.totalWorkouts = state.streak; // Seriyi toplam güne aktar
                    }
                }

                if (!state.isFirstLaunch && state.currentView === 'calendar' && !window.forcedCalendarOpen) {
                    state.currentView = 'home';
                }
            } catch (e) {
                console.error("State yüklenemedi", e);
            }
        }
    }

    function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getExerciseById(id) {
        for (const group in EXERCISES) {
            const found = EXERCISES[group].find(ex => ex.id === id);
            if (found) return found;
        }
        return null;
    }

    const appElement = document.getElementById('app');
    const modalRoot = document.getElementById('modal-root');
    const modalContent = document.getElementById('modal-content');

    window.showModal = function(htmlContent) {
        modalContent.innerHTML = htmlContent;
        modalRoot.classList.remove('hidden');
        setTimeout(() => {
            modalRoot.classList.remove('opacity-0');
            modalContent.classList.remove('scale-95');
        }, 10);
    }

    window.closeModal = function() {
        modalRoot.classList.add('opacity-0');
        modalContent.classList.add('scale-95');
        setTimeout(() => {
            modalRoot.classList.add('hidden');
            modalContent.innerHTML = '';
        }, 300);
    }

    window.getWeight = function(exerciseId, defaultWeight) {
        return state.weights[exerciseId] || defaultWeight;
    }

    window.render = function() {
        appElement.innerHTML = ''; 
        
        if (state.currentView === 'home') renderHome();
        else if (state.currentView === 'calendar') renderCalendarView();
        else if (state.currentView === 'guide') renderGuide();
        else if (state.currentView === 'settings') renderSettings();
    }

    window.changeMonth = function(delta) {
        calMonth += delta;
        if(calMonth > 11) { calMonth = 0; calYear++; }
        if(calMonth < 0) { calMonth = 11; calYear--; }
        render();
    }

    function renderCalendarView() {

        container.className = 'flex-1 overflow-y-auto no-scrollbar p-5 flex flex-col fade-in pb-28';
        
        const monthNames = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
        
        let html = `
            <div class="flex items-center mb-5">

                </div>
                <div>
                    <h1 class="text-2xl font-extrabold text-white leading-tight">Takvim</h1>
                    <p class="text-xs text-slate-400">Günlere tıklayarak antrenman planla.</p>
                </div>
            </div>
        `;

        if (state.isFirstLaunch) {
            html += `
                <div class="bg-blue-900/30 border border-blue-500/40 rounded-xl p-4 mb-5 text-left shadow-md flex items-start">
                    <span class="text-2xl mr-3">👋</span>
                    <div>
                        <h4 class="text-sm font-bold text-white mb-1">FitTrack'e Hoş Geldin!</h4>
                        <p class="text-xs text-blue-200/80 leading-relaxed">Aşağıdaki takvimden bugün veya gelecekte spor yapacağın günleri seçip bölgelerini belirleyerek başla.</p>
                    </div>
                </div>
            `;
        }

        // Takvim Çizimi
        html += `
            <div class="bg-slate-800 p-4 rounded-3xl border border-slate-700 shadow-xl relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-32 h-32 bg-orange-500/10 rounded-full blur-3xl"></div>
                
                <div class="flex justify-between items-center mb-5 relative z-10">
                    <button onclick="changeMonth(-1)" class="p-2 bg-slate-900 hover:bg-slate-700 rounded-xl text-slate-300 transition-colors border border-slate-700">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <h3 class="text-white font-extrabold text-lg tracking-wide">${monthNames[calMonth]} ${calYear}</h3>
                    <button onclick="changeMonth(1)" class="p-2 bg-slate-900 hover:bg-slate-700 rounded-xl text-slate-300 transition-colors border border-slate-700">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </div>
                
                <div class="grid grid-cols-7 gap-1 text-center mb-3 relative z-10">
                    ${['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'].map(d => `<span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">${d}</span>`).join('')}
                </div>
                
                <div class="grid grid-cols-7 gap-1.5 relative z-10" id="calendar-grid">
        `;

        let firstDayIdx = getFirstDayOfMonth(calYear, calMonth);
        for(let i=0; i<firstDayIdx; i++) {
            html += `<div class="py-2.5"></div>`;
        }

        let daysInMonth = getDaysInMonth(calYear, calMonth);
        let today = new Date();
        let todayStr = toDateStr(today.getFullYear(), today.getMonth(), today.getDate());

        for(let d=1; d<=daysInMonth; d++) {
            let dateStr = toDateStr(calYear, calMonth, d);
            let planArr = state.schedule[dateStr] || [];
            let hasPlan = planArr.length > 0;
            let isCompleted = state.workoutHistory && state.workoutHistory[dateStr];
            let isToday = dateStr === todayStr;

            let bgClass = isCompleted ? 'bg-green-500/20 border-green-500/50 text-green-300' :
                          hasPlan ? 'bg-orange-500/20 border-orange-500/50 text-orange-300' :
                          'bg-slate-900 border-slate-700 text-slate-300 hover:bg-slate-700/80';

            let ringClass = isToday ? 'ring-2 ring-white ring-offset-2 ring-offset-slate-800' : '';
            
            // Nokta göstergesi
            let dotClass = isCompleted ? 'bg-green-500 shadow-[0_0_5px_#22c55e]' : 
                           hasPlan ? 'bg-orange-500 shadow-[0_0_5px_#f97316]' : 'bg-transparent';

            html += `
            <div onclick="openDayPlanner('${dateStr}')" class="flex flex-col items-center justify-center py-2 rounded-xl border border-b-2 cursor-pointer active:scale-90 transition-all ${bgClass} ${ringClass}">
                <span class="text-sm font-black">${d}</span>
                <div class="h-1.5 w-1.5 rounded-full mt-0.5 ${dotClass}"></div>
            </div>`;
        }

        html += `</div></div>`;
        
        // Renk Lejantı
        html += `
            <div class="flex items-center justify-center space-x-5 mt-6 mb-2">
                <div class="flex items-center text-xs text-slate-400 font-medium">
                    <span class="w-2.5 h-2.5 rounded-full bg-green-500 mr-1.5 shadow-[0_0_5px_#22c55e]"></span> Tamamlandı
                </div>
                <div class="flex items-center text-xs text-slate-400 font-medium">
                    <span class="w-2.5 h-2.5 rounded-full bg-orange-500 mr-1.5 shadow-[0_0_5px_#f97316]"></span> Planlı
                </div>
            </div>
        `;

        container.innerHTML = html;
        appElement.appendChild(container);
        appElement.appendChild(createBottomNav('calendar'));
    }

    window.openDayPlanner = function(dateStr) {
        let dateObj = parseDateStr(dateStr);
        const dayNames = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
        const monthNames = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
        let friendlyDate = `${dateObj.getDate()} ${monthNames[dateObj.getMonth()]} ${dayNames[dateObj.getDay()]}`;

        let currentPlan = state.schedule[dateStr] || [];

        let checkboxesHtml = KAS_GRUPLARI.map(k => `
            <label class="cursor-pointer group">
                <input type="checkbox" value="${k}" ${currentPlan.includes(k) ? 'checked' : ''} class="peer hidden region-cb">
                <div class="px-4 py-3 rounded-xl text-sm font-medium bg-slate-900/50 text-slate-400 border border-slate-700 peer-checked:bg-orange-500/20 peer-checked:text-orange-400 peer-checked:border-orange-500 transition-all active:scale-95 select-none text-left flex justify-between items-center group-hover:border-slate-500">
                    ${k}
                    <div class="w-4 h-4 rounded-full border border-current flex items-center justify-center opacity-0 peer-checked:opacity-100 transition-opacity">
                        <div class="w-2 h-2 bg-current rounded-full"></div>
                    </div>
                </div>
            </label>
        `).join('');

        let applyToAllCheckbox = `
            <label class="flex items-start space-x-3 mt-6 p-4 bg-slate-900 border border-slate-700 rounded-xl cursor-pointer">
                <input type="checkbox" id="apply-to-all" class="mt-0.5 w-5 h-5 accent-orange-500 rounded bg-slate-800 border-slate-600">
                <div class="flex-1">
                    <span class="block text-sm font-bold text-white mb-1">Tüm <b>${dayNames[dateObj.getDay()]}</b> Günlerine Uygula</span>
                    <span class="block text-[10px] text-slate-400 leading-tight">İşaretlersen, bu ayki tüm ${dayNames[dateObj.getDay()]} günlerine aynı plan kaydedilir. Düzenli rutin oluşturmak için idealdir.</span>
                </div>
            </label>
        `;

        showModal(`

    window.saveDayPlan = function(dateStr) {
        const selected = Array.from(document.querySelectorAll('.region-cb:checked')).map(cb => cb.value);
        const applyToAll = document.getElementById('apply-to-all').checked;

        // Tekil günü kaydet
        if (selected.length === 0) {
            delete state.schedule[dateStr];
        } else {
            state.schedule[dateStr] = selected;
        }

        // Hızlı rutin kopyalama seçiliyse
        if (applyToAll) {
            let dateObj = parseDateStr(dateStr);
            let dayOfWeek = dateObj.getDay();
            let year = dateObj.getFullYear();
            let month = dateObj.getMonth();
            let daysInMonth = getDaysInMonth(year, month);

            for(let d=1; d<=daysInMonth; d++) {
                let tempDate = new Date(year, month, d);
                if(tempDate.getDay() === dayOfWeek) {
                    let tempDateStr = toDateStr(year, month, d);
                    if (selected.length === 0) {
                        delete state.schedule[tempDateStr];
                    } else {
                        state.schedule[tempDateStr] = [...selected];
                    }
                }
            }
        }

        if(state.isFirstLaunch && selected.length > 0) {
            state.isFirstLaunch = false;
            state.currentView = 'home';
        }

        saveState();
        closeModal();
        render();
    }

    window.finishWorkout = function() {
        let today = new Date();
        let todayStrYYYY_MM_DD = toDateStr(today.getFullYear(), today.getMonth(), today.getDate());

        let totalKcalBurned = 50; 
        
        activePlans.forEach(planName => {
            const exercisesList = EXERCISES[planName] || [];
            exercisesList.forEach(ex => {
                if(ex.startWeight > 0) { 
                    let current = getWeight(ex.id, ex.startWeight);
                    state.weights[ex.id] = current + 2.5; 
                }
                totalKcalBurned += ex.kcal; 
            });
        });
        
        const targetKcal = 2800 + totalKcalBurned;

        if (!state.workoutHistory) state.workoutHistory = {};

        // Gün tarihçeye eklenmemişse toplam günü (streak) artır
        if (!state.workoutHistory[todayStrYYYY_MM_DD]) {

                    <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </div>
                <h1 class="text-2xl font-extrabold text-white">Ayarlar</h1>
            </div>
            
            <!-- VERİ GÜVENLİĞİ VE YEDEKLEME -->
            <div class="bg-slate-800 p-5 rounded-3xl border border-slate-700 shadow-xl mb-5">
                <h3 class="text-white font-bold mb-2 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    Verileri Yedekle ve Kurtar
                </h3>
                <p class="text-[11px] text-slate-400 mb-5 leading-relaxed">Tarayıcını uzun süre kullanmazsan verilerin otomatik silinebilir. Emeklerinin kaybolmaması için dosyayı cihazına indir.</p>
                <div class="flex space-x-3">
                    <button onclick="exportData()" class="flex-1 bg-slate-900 border border-slate-700 hover:border-green-500 text-white font-bold py-3 px-3 rounded-xl transition-all active:scale-95 text-xs shadow-sm flex flex-col items-center justify-center">
                        <svg class="w-5 h-5 mb-1 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        İndir (Yedekle)
                    </button>
                    <button onclick="triggerImport()" class="flex-1 bg-slate-900 border border-slate-700 hover:border-blue-500 text-white font-bold py-3 px-3 rounded-xl transition-all active:scale-95 text-xs shadow-sm flex flex-col items-center justify-center">
                        <svg class="w-5 h-5 mb-1 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        Dosyadan Yükle
                    </button>
                </div>
                <input type="file" id="import-file" class="hidden" accept=".json" onchange="importData(event)">
            </div>

            <!-- HATIRLATICILAR -->
            <div class="bg-slate-800 p-5 rounded-3xl border border-slate-700 shadow-xl mb-5">
                <h3 class="text-white font-bold mb-3 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Günlük Hatırlatıcılar
                </h3>
                <div class="mb-5" id="reminders-list">
                    ${remindersHtml || '<p class="text-xs text-slate-400 mb-2">Henüz hatırlatıcı eklenmedi.</p>'}
                </div>
                <div class="flex items-center space-x-3">
                    <input type="time" id="new-reminder-time" class="bg-slate-900 border border-slate-700 text-white font-bold text-lg rounded-xl focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 outline-none shadow-inner">
                    <button onclick="addReminderTime()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-5 rounded-xl transition-colors active:scale-95 shadow-lg shadow-blue-600/30 whitespace-nowrap">Ekle</button>
                </div>
            </div>

            <!-- SIFIRLAMA -->
            <div class="bg-slate-800 p-5 rounded-3xl border border-slate-700 shadow-xl">
                <h3 class="text-white font-bold mb-2 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    Uygulamayı Sıfırla
                </h3>
                <p class="text-[11px] text-slate-400 mb-5 leading-relaxed">Tüm takvim verilerin, hedeflerin ve başarıların kalıcı olarak silinir. Uygulama ilk günkü haline döner.</p>
                <button onclick="confirmReset()" class="w-full bg-red-500/10 text-red-500 border border-red-500/50 font-bold py-3.5 px-4 rounded-xl hover:bg-red-600 hover:text-white transition-all active:scale-95 shadow-sm">Tüm Verileri Sil</button>
            </div>
        `;
        appElement.appendChild(container);
        appElement.appendChild(createBottomNav('settings'));
    }

    window.exportData = function() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        // Bugünün tarihi ile dosya adı oluştur
        let today = new Date();
        let dateStr = `${today.getFullYear()}${(today.getMonth()+1).toString().padStart(2,'0')}${today.getDate().toString().padStart(2,'0')}`;
        downloadAnchorNode.setAttribute("download", `FitTrack_Yedek_${dateStr}.json`);
        document.body.appendChild(downloadAnchorNode); 
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
    }

    window.triggerImport = function() {
        document.getElementById('import-file').click();
    }

    window.importData = function(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedState = JSON.parse(e.target.result);
                if(importedState && importedState.schedule !== undefined) {
                    state = { ...state, ...importedState };
                    saveState();
                    showModal(`
                        <div class="text-center p-2">
                            <div class="text-5xl mb-4">🎉</div>
                            <h3 class="text-2xl font-black text-white mb-2">Başarılı!</h3>
                            <p class="text-slate-300 text-sm mb-6">Verilerin dosyadan başarıyla yüklendi. Kaldığın yerden devam edebilirsin.</p>
                            <button onclick="closeModal(); render();" class="w-full bg-slate-700 text-white font-bold py-3.5 rounded-xl border border-slate-600 active:scale-95">Tamam</button>
                        </div>
                    `);
                } else {
                    throw new Error("Eksik veri");
                }
            } catch(err) {
                showModal(`
                    <div class="text-center p-2">
                        <div class="text-5xl mb-4">⚠️</div>
                        <h3 class="text-2xl font-black text-white mb-2">Hata!</h3>
                        <p class="text-slate-300 text-sm mb-6">Dosya okunamadı veya geçersiz bir FitTrack dosyası seçtin.</p>
                        <button onclick="closeModal();" class="w-full bg-slate-700 text-white font-bold py-3.5 rounded-xl border border-slate-600 active:scale-95">Kapat</button>
                    </div>
                `);
            }
        };
        reader.readAsText(file);
    }

    window.addReminderTime = function() {
        const time = document.getElementById('new-reminder-time').value;
        if (!time) return;
        if (!state.reminderTimes) state.reminderTimes = [];
        if (state.reminderTimes.includes(time)) return;
        
        state.reminderTimes.push(time);
        state.reminderTimes.sort(); 
        saveState();
        render();
    }

    window.removeReminderTime = function(index) {
        state.reminderTimes.splice(index, 1);
        saveState();
        render();
    }

    window.confirmReset = function() {
        showModal(`
            <div class="text-center p-2">
                <div class="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-[0_0_15px_rgba(239,68,68,0.3)] border border-red-500/30">🗑️</div>
                <h3 class="text-xl font-black text-white mb-2">Emin misin?</h3>
                <p class="text-sm text-slate-300 mb-6 leading-relaxed">Tüm verilerin kalıcı olarak silinecek. İstersen önce yedek alabilirsin. Bu işlem geri alınamaz.</p>
                <div class="flex space-x-3">
                    <button onclick="closeModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-bold py-3.5 rounded-xl transition-colors active:scale-95 border border-slate-600">İptal</button>
                    <button onclick="executeReset()" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-3.5 rounded-xl transition-colors shadow-lg shadow-red-600/30 active:scale-95 border border-red-400/30">SİL</button>
                </div>
            </div>
        `);
    }

    window.executeReset = function() {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
    }

    function createBottomNav(activeTab) {
        const nav = document.createElement('div');
        nav.className = 'absolute bottom-0 w-full bg-slate-950/95 backdrop-blur-lg border-t border-slate-800/80 z-40 pb-safe';
        
        const getClasses = (t) => activeTab === t ? 'text-orange-500 scale-105' : 'text-slate-500 hover:text-slate-400';
        
        nav.innerHTML = `
            <div class="flex justify-around items-center py-3.5 px-2">
                <button onclick="window.navigate('home')" class="flex flex-col items-center ${getClasses('home')} transition-all active:scale-90">
                    <svg class="w-6 h-6 mb-1" fill="${activeTab==='home'?'currentColor':'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    <span class="text-[10px] font-bold tracking-wide">Ana Sayfa</span>
                </button>
                <button onclick="window.navigate('calendar')" class="flex flex-col items-center ${getClasses('calendar')} transition-all active:scale-90">
                    <svg class="w-6 h-6 mb-1" fill="${activeTab==='calendar'?'currentColor':'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <span class="text-[10px] font-bold tracking-wide">Takvim</span>
                </button>
                <button onclick="window.navigate('guide')" class="flex flex-col items-center ${getClasses('guide')} transition-all active:scale-90">
                    <svg class="w-6 h-6 mb-1" fill="${activeTab==='guide'?'currentColor':'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                    <span class="text-[10px] font-bold tracking-wide">Rehber</span>
                </button>
                <button onclick="window.navigate('settings')" class="flex flex-col items-center ${getClasses('settings')} transition-all active:scale-90">
                    <svg class="w-6 h-6 mb-1" fill="${activeTab==='settings'?'currentColor':'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <span class="text-[10px] font-bold tracking-wide">Ayarlar</span>
                </button>
            </div>
        `;
        return nav;
    }

    window.navigate = function(view) {
        if (state.currentView !== view) {
            state.currentView = view;
            render();
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadState();
        render();
        
        // Eğer uygulama arkada uzun süre kalır da gün değişirse otomatik yenile
        let lastCheckedDate = new Date().getDate();
        setInterval(() => {
            const currentDate = new Date().getDate();
            if (currentDate !== lastCheckedDate) {
                lastCheckedDate = currentDate;
                if (state.currentView === 'home' || state.currentView === 'calendar') {
                    render(); 
                }
            }
        }, 60000); 
    });

</script>



<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(err => console.warn('Service worker kaydedilemedi:', err));
  });
}
</script>
</body>
</html>
