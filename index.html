<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FitTrack - 3D Spor Asistanın</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; 
            color: #f8fafc; 
            -webkit-tap-highlight-color: transparent;
            overflow: hidden; 
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            height: 100vh; 
            background-color: #0f172a;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Görsel Yükleniyor Göstergesi */
        .img-container {
            background-image: radial-gradient(circle at center, #ffffff 0%, #f1f5f9 100%);
        }
    </style>
</head>
<body class="bg-gray-950 flex justify-center text-slate-100">

    <div id="app" class="app-container w-full overflow-hidden flex flex-col fade-in">
        <!-- İçerik buraya yüklenecek -->
    </div>

    <!-- Genel Modal Kapsayıcısı -->
    <div id="modal-root" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-300 p-4">
        <div id="modal-content" class="bg-slate-800 p-6 rounded-3xl shadow-2xl w-full max-w-sm max-h-[90vh] overflow-y-auto no-scrollbar transform transition-transform duration-300 scale-95 border border-slate-700">
            <!-- Modal içeriği -->
        </div>

        const STORAGE_KEY = 'fittrack_data_v5'; // Çoklu seçim için versiyon güncellendi
        
        let state = {
            isFirstLaunch: true,
            currentView: 'onboarding',
            streak: 0,
            lastWorkoutDate: null,
            schedule: {}, // Artık { 1: ['Göğüs', 'Sırt'], 2: ['Bacak'] } şeklinde array tutacak
            weights: {},
            reminderTimes: ['09:00'] // Çoklu hatırlatıcı için dizi (array) yapıldı
        };

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    // Eski sürümden kalan tekli reminderTime varsa diziye çevir (Göç/Migration işlemi)
                    if (parsed.reminderTime && !parsed.reminderTimes) {
                        parsed.reminderTimes = [parsed.reminderTime];
                        delete parsed.reminderTime;
                    }
                    state = { ...state, ...parsed };
                    if (!state.isFirstLaunch && state.currentView === 'onboarding') {
                        state.currentView = 'home';
                    }
                } catch (e) {
                    console.error("State yüklenemedi", e);
                }
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function getExerciseById(id) {
            for (const group in EXERCISES) {
                const found = EXERCISES[group].find(ex => ex.id === id);
                if (found) return found;
            }
            return null;
        }

        const appElement = document.getElementById('app');
        const modalRoot = document.getElementById('modal-root');
        const modalContent = document.getElementById('modal-content');

        window.showModal = function(htmlContent) {
            modalContent.innerHTML = htmlContent;
            modalRoot.classList.remove('hidden');
            setTimeout(() => {
                modalRoot.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);
        }

        window.closeModal = function() {
            modalRoot.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modalRoot.classList.add('hidden');
                modalContent.innerHTML = '';
            }, 300);
        }

        window.getWeight = function(exerciseId, defaultWeight) {
            return state.weights[exerciseId] || defaultWeight;
        }

        window.render = function() {
            appElement.innerHTML = ''; 
            
            if (state.currentView === 'onboarding') renderOnboarding();
            else if (state.currentView === 'home') renderHome();
            else if (state.currentView === 'guide') renderGuide();
            else if (state.currentView === 'settings') renderSettings();
            else if (state.currentView === 'edit_schedule') renderEditSchedule();
        }

        function renderOnboarding() {
            const container = document.createElement('div');
            container.className = 'flex-1 overflow-y-auto no-scrollbar p-6 flex flex-col fade-in pb-10';
            
            let dayCheckboxes = GUNLER.map(g => `
                <div class="flex flex-col mb-3 bg-slate-900 border border-slate-700 rounded-xl overflow-hidden transition-all duration-300" id="day-card-${g.id}">
                    <label class="flex items-center space-x-3 p-4 cursor-pointer">
                        <input type="checkbox" value="${g.id}" id="cb-${g.id}" class="day-checkbox w-5 h-5 accent-orange-500 rounded bg-slate-800 border-slate-600">
                        <span class="text-sm font-medium text-slate-200">${g.ad}</span>
                    </label>
                    <div id="select-wrapper-${g.id}" class="hidden px-4 pb-4 border-t border-slate-800 pt-3">
                        <p class="text-xs text-slate-400 mb-3">Bu gün hangi bölgeleri çalışacaksın? <br/><span class="text-[10px] text-orange-400">(Birden fazla seçebilirsin)</span></p>
                        <div class="flex flex-wrap gap-2">
                            ${KAS_GRUPLARI.map(k => `
                                <label class="cursor-pointer">
                                    <input type="checkbox" value="${k}" class="peer hidden region-cb-${g.id}">
                                    <div class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-400 border border-slate-700 peer-checked:bg-orange-500/20 peer-checked:text-orange-400 peer-checked:border-orange-500 transition-all active:scale-95 select-none">
                                        ${k}
                                    </div>
                                </label>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `).join('');

            container.innerHTML = `
                <div class="text-center mb-6 mt-4">
                    <div class="mx-auto w-16 h-16 bg-orange-500/20 rounded-full flex items-center justify-center mb-4 shadow-[0_0_15px_rgba(249,115,22,0.3)]">
                        <svg class="w-8 h-8 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                    </div>
                    <h1 class="text-2xl font-extrabold text-white mb-2">Programını Oluştur</h1>
                    <p class="text-slate-400 text-sm">Spor yapacağın günleri ve çalışacağın bölgeleri seç.</p>
                </div>
                
                <div class="w-full mb-8 text-left" id="onboarding-days">
                    ${dayCheckboxes}
                </div>
                
                <button id="btn-finish-setup" class="w-full bg-gradient-to-r from-orange-500 to-red-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-orange-500/30 active:scale-95 transition-transform text-lg mb-6">
                    Programı Kaydet ve Başla
                </button>
            `;
            appElement.appendChild(container);

            GUNLER.forEach(g => {
                const cb = document.getElementById(`cb-${g.id}`);
                const wrapper = document.getElementById(`select-wrapper-${g.id}`);
                const card = document.getElementById(`day-card-${g.id}`);
                
                cb.addEventListener('change', (e) => {
                    if(e.target.checked) {
                        wrapper.classList.remove('hidden');
                        card.classList.add('border-orange-500');
                        card.classList.remove('border-slate-700');
                    } else {
                        wrapper.classList.add('hidden');
                        card.classList.remove('border-orange-500');
                        card.classList.add('border-slate-700');
                    }
                });
            });

            document.getElementById('btn-finish-setup').addEventListener('click', () => {
                const selectedCheckboxes = document.querySelectorAll('.day-checkbox:checked');
                
                let isValid = true;
                let hasAtLeastOneRegion = false;
                state.schedule = {};

                if(selectedCheckboxes.length === 0) {
                    showModal(`
                        <div class="text-center">
                            <div class="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                                <span class="text-2xl">⚠️</span>
                            </div>
                            <h3 class="text-xl font-bold text-white mb-2">Uyarı</h3>
                            <p class="text-sm text-slate-300 mb-6">Devam etmek için en az bir gün seçmelisin.</p>
                            <button onclick="closeModal()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl transition-colors">Anladım</button>
                        </div>
                    `);
                    return;
                }

                selectedCheckboxes.forEach(cb => {
                    const dayId = parseInt(cb.value);
                    const regionCheckboxes = document.querySelectorAll(`.region-cb-${dayId}:checked`);
                    const selectedRegions = Array.from(regionCheckboxes).map(rcb => rcb.value);
                    
                    if(selectedRegions.length === 0) {
                        isValid = false;
                    } else {
                        state.schedule[dayId] = selectedRegions;
                        hasAtLeastOneRegion = true;
                    }
                });

                if(!isValid || !hasAtLeastOneRegion) {
                    showModal(`
                        <div class="text-center">
                            <div class="w-16 h-16 bg-orange-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                                <span class="text-2xl">💪</span>
                            </div>
                            <h3 class="text-xl font-bold text-white mb-2">Eksik Seçim</h3>
                            <p class="text-sm text-slate-300 mb-6">Lütfen seçtiğin günler için en az bir kas grubu belirle.</p>
                            <button onclick="closeModal()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl transition-colors">Tamam</button>
                        </div>
                    `);
                    return;
                }

                state.isFirstLaunch = false;
                state.currentView = 'home';
                saveState();
                render();
            });
        }

                </div>

                <div class="bg-slate-800 rounded-2xl p-5 mb-8 border border-slate-700 shadow-lg relative overflow-hidden">
                    <div class="absolute -right-4 -top-4 w-24 h-24 bg-green-500/10 rounded-full blur-2xl"></div>
                    <h3 class="text-white font-bold text-sm mb-4 flex items-center">

                        Sabit Beslenme Hedefi
                    </h3>
                    <div class="flex justify-between items-end mb-4">
                        <span class="text-4xl font-black text-white tracking-tight">2800 <span class="text-sm font-normal text-slate-400">kcal</span></span>
                        <span class="text-xs text-slate-400 mb-1.5 bg-slate-900 px-2 py-1 rounded-md">Kilo koruma için</span>
                    </div>
                    <div class="grid grid-cols-3 gap-3 mt-4">
                        <div class="bg-slate-900/80 rounded-xl p-2.5 text-center border border-slate-700/50">
                            <span class="block text-[10px] text-slate-400 uppercase tracking-wider mb-1">Protein</span>
                            <span class="block text-base font-bold text-blue-400">150g</span>
                        </div>
                        <div class="bg-slate-900/80 rounded-xl p-2.5 text-center border border-slate-700/50">
                            <span class="block text-[10px] text-slate-400 uppercase tracking-wider mb-1">Karb</span>
                            <span class="block text-base font-bold text-yellow-400">300g</span>
                        </div>
                        <div class="bg-slate-900/80 rounded-xl p-2.5 text-center border border-slate-700/50">
                            <span class="block text-[10px] text-slate-400 uppercase tracking-wider mb-1">Yağ</span>
                            <span class="block text-base font-bold text-red-400">80g</span>
                        </div>
                    </div>

        window.finishWorkout = function() {
            const todayStr = new Date().toDateString();
            const todayIndex = new Date().getDay();
            const activePlans = state.schedule[todayIndex] || [];
            
            let totalKcalBurned = 50; // Isınma kalorisi baz değer
            
            // Tüm seçili bölgelerdeki hareketleri dön
            activePlans.forEach(planName => {
                const exercisesList = EXERCISES[planName] || [];
                exercisesList.forEach(ex => {
                    if(ex.startWeight > 0) { // Sadece ağırlıklı hareketlerde kilo artışı yap
                        let current = getWeight(ex.id, ex.startWeight);
                        state.weights[ex.id] = current + 2.5; 
                    }
                    totalKcalBurned += ex.kcal; 
                });
            });
            
            const targetKcal = 2800 + totalKcalBurned;

            if (state.lastWorkoutDate !== todayStr) {
                state.streak += 1;
                state.lastWorkoutDate = todayStr;
                saveState();
            }

            showModal(`
                <div class="text-center p-2">
                    <div class="text-5xl mb-3">🚀</div>

                            <span class="block text-slate-400 text-[10px] uppercase tracking-widest mb-1">Yakılan Kalori</span>
                            <span class="block text-3xl font-black text-orange-500">${totalKcalBurned}</span>
                        </div>
                        <div class="bg-slate-900 rounded-xl p-4 border border-slate-700 shadow-inner">
                            <span class="block text-slate-400 text-[10px] uppercase tracking-widest mb-1">Gün Serin</span>
                            <span class="block text-3xl font-black text-white">${state.streak}</span>
                        </div>
                    </div>

                            <span class="text-slate-400 tracking-wider">2800 + ${totalKcalBurned}</span>
                            <span class="text-xl font-bold text-green-400">= ${targetKcal}</span>
                        </div>
                        <p class="text-[11px] text-slate-400 mt-3 leading-relaxed">Kas kütleni korumak ve erimeyi engellemek için bugün bu kaloriye ulaşmalısın. İyi dinlen!</p>

                    <button onclick="closeModal(); render();" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-500/30 active:scale-95 transition-all text-lg">Kapat ve Ana Sayfaya Dön</button>

        window.addReminderTime = function() {
            const time = document.getElementById('new-reminder-time').value;
            if (!time) {
                showModal(`
                    <div class="text-center p-2">
                        <div class="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">⚠️</div>
                        <h3 class="text-xl font-extrabold text-white mb-2">Hata</h3>
                        <p class="text-sm text-slate-300 mb-6">Lütfen eklenecek geçerli bir saat seç.</p>
                        <button onclick="closeModal()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl transition-colors">Tamam</button>
                    </div>
                `);
                return;
            }
            
            if (!state.reminderTimes) state.reminderTimes = [];
            
            if (state.reminderTimes.includes(time)) {
                showModal(`
                    <div class="text-center p-2">
                        <div class="w-16 h-16 bg-orange-500/20 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">⏰</div>
                        <h3 class="text-xl font-extrabold text-white mb-2">Zaten Ekli</h3>

                    </div>
                `);
                return;
            }
            
            state.reminderTimes.push(time);
            state.reminderTimes.sort(); // Saatleri küçükten büyüğe sırala (ör: 09:00, 15:30)
            saveState();
            
            // Ekranı anında güncelle
            renderSettings();
        }

                const cb = document.getElementById(`edit-cb-${g.id}`);
                const wrapper = document.getElementById(`edit-select-wrapper-${g.id}`);
                const card = document.getElementById(`edit-day-card-${g.id}`);
                
                if(cb) {
                    cb.addEventListener('change', (e) => {
                        if(e.target.checked) {
                            wrapper.classList.remove('hidden');
                            card.classList.add('border-orange-500');
                            card.classList.remove('border-slate-700');
                        } else {
                            wrapper.classList.add('hidden');
                            card.classList.remove('border-orange-500');
                            card.classList.add('border-slate-700');
                        }
                    });
                }
            });

            document.getElementById('btn-save-schedule').addEventListener('click', () => {
                const selectedCheckboxes = document.querySelectorAll('.edit-day-checkbox:checked');
                
                let isValid = true;
                let hasAtLeastOneRegion = false;
                let newSchedule = {};

                if(selectedCheckboxes.length === 0) {
                    showModal(`
                        <div class="text-center">
                            <div class="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                                <span class="text-2xl">⚠️</span>
                            </div>
                            <h3 class="text-xl font-bold text-white mb-2">Uyarı</h3>
                            <p class="text-sm text-slate-300 mb-6">Lütfen en az bir gün seç.</p>
                            <button onclick="closeModal()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl transition-colors">Anladım</button>
                        </div>
                    `);
                    return;
                }

                selectedCheckboxes.forEach(cb => {
                    const dayId = parseInt(cb.value);
                    const regionCheckboxes = document.querySelectorAll(`.edit-region-cb-${dayId}:checked`);
                    const selectedRegions = Array.from(regionCheckboxes).map(rcb => rcb.value);
                    
                    if(selectedRegions.length === 0) {
                        isValid = false;
                    } else {
                        newSchedule[dayId] = selectedRegions;
                        hasAtLeastOneRegion = true;
                    }
                });

                if(!isValid || !hasAtLeastOneRegion) {
                    showModal(`
                        <div class="text-center">
                            <div class="w-16 h-16 bg-orange-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                                <span class="text-2xl">💪</span>
                            </div>
                            <h3 class="text-xl font-bold text-white mb-2">Eksik Seçim</h3>
                            <p class="text-sm text-slate-300 mb-6">Lütfen seçtiğin günler için en az bir kas grubu belirle.</p>
                            <button onclick="closeModal()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl transition-colors">Tamam</button>
                        </div>
                    `);
                    return;
                }

                state.schedule = newSchedule;
                saveState();
                
                showModal(`
                    <div class="text-center">
                        <div class="w-16 h-16 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                            <span class="text-2xl">✅</span>
                        </div>
                        <h3 class="text-xl font-bold text-white mb-2">Başarılı</h3>
                        <p class="text-sm text-slate-300 mb-6">Programın başarıyla güncellendi!</p>
                        <button onclick="closeModal(); window.navigate('settings');" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl transition-colors">Tamam</button>
                    </div>
                `);
            });
            
            appElement.appendChild(createBottomNav('settings'));
        }

        // Özel Confirm Modalı
        window.confirmReset = function() {
            showModal(`
                <div class="text-center p-2">
                    <div class="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">🗑️</div>
                    <h3 class="text-xl font-extrabold text-white mb-2">Emin misin?</h3>
                    <p class="text-sm text-slate-300 mb-6 leading-relaxed">Tüm verilerin kalıcı olarak silinecek ve başa döneceksin. Bu işlem geri alınamaz.</p>
                    <div class="flex space-x-3">
                        <button onclick="closeModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl transition-colors active:scale-95">İptal</button>
                        <button onclick="executeReset()" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-xl transition-colors shadow-lg shadow-red-600/30 active:scale-95">Evet, Sil</button>
                    </div>
                </div>
            `);
        }

        window.executeReset = function() {
            localStorage.removeItem(STORAGE_KEY);
            location.reload();
        }

        function createBottomNav(activeTab) {
            const nav = document.createElement('div');
            nav.className = 'absolute bottom-0 w-full bg-slate-950/90 backdrop-blur-lg border-t border-slate-800 z-40 pb-safe';
            const getClasses = (t) => activeTab === t ? 'text-orange-500 scale-110' : 'text-slate-500 hover:text-slate-300';
            nav.innerHTML = `
                <div class="flex justify-around items-center py-3 px-2">
                    <button onclick="window.navigate('home')" class="flex flex-col items-center ${getClasses('home')} transition-all active:scale-95">
                        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                        <span class="text-[10px] font-bold">Ana Sayfa</span>
                    </button>
                    <button onclick="window.navigate('guide')" class="flex flex-col items-center ${getClasses('guide')} transition-all active:scale-95">
                        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                        <span class="text-[10px] font-bold">Rehber</span>
                    </button>
                    <button onclick="window.navigate('settings')" class="flex flex-col items-center ${getClasses('settings')} transition-all active:scale-95">
                        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        <span class="text-[10px] font-bold">Ayarlar</span>
                    </button>
                </div>
            `;
            return nav;
        }

        window.navigate = function(view) {
            if (state.currentView !== view) {
                state.currentView = view;
                render();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadState();
            render();
        });

    </script>
</body>
</html>
